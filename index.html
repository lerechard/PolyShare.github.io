<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cal Poly PDF Share 2</title>

  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1f2328;
      background: #f6f8fa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 32px 16px;
    }

    .container {
      width: min(1400px, 100%);
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 2rem;
    }

    .subtitle {
      margin: 0 0 20px;
      color: #656d76;
    }

    .toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }

    #search {
      width: min(420px, 100%);
      padding: 10px 12px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      background: #fff;
      color: inherit;
      font: inherit;
    }

    #search:focus {
      outline: 2px solid #0969da;
      outline-offset: -1px;
    }

    button {
      padding: 9px 12px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      background: #fff;
      color: #1f2328;
      font: inherit;
      cursor: pointer;
    }

    button:hover:not(:disabled) {
      background: #f3f4f6;
    }

    button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .status {
      color: #656d76;
      font-size: 0.9rem;
    }

    .loading-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 5px;
      border-radius: 50%;
      background: #1a7f37;
      vertical-align: middle;
      animation: pulse 0.8s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      from {
        opacity: 0.25;
      }

      to {
        opacity: 1;
      }
    }

    .table-wrap {
      max-height: 76vh;
      overflow: auto;
      background: #fff;
      border: 1px solid #d0d7de;
      border-radius: 8px;
    }

    table {
      width: 100%;
      min-width: 700px;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 9px 12px;
      border-right: 1px solid #d8dee4;
      border-bottom: 1px solid #d8dee4;
      text-align: left;
      vertical-align: top;
      white-space: nowrap;
    }

    th:last-child,
    td:last-child {
      border-right: 0;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: #f6f8fa;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
    }

    th:hover {
      background: #eaeef2;
    }

    tbody tr:nth-child(even) {
      background: #fbfcfd;
    }

    tbody tr:hover {
      background: #eef6ff;
    }

    td a {
      color: #0969da;
      text-decoration: none;
    }

    td a:hover {
      text-decoration: underline;
    }

    .sort-arrow {
      margin-left: 4px;
      font-size: 0.75em;
      color: #656d76;
    }

    .message {
      padding: 28px;
      color: #656d76;
      text-align: center;
      background: #fff;
      border: 1px solid #d0d7de;
      border-radius: 8px;
    }

    .error {
      padding: 16px;
      color: #cf222e;
      background: #ffebe9;
      border: 1px solid #ff8182;
      border-radius: 8px;
    }

    @media (max-width: 700px) {
      body {
        padding: 18px 10px;
      }

      h1 {
        font-size: 1.6rem;
      }

      #search {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <h1>Cal Poly PDF Share 2</h1>
    <p class="subtitle">It's the remix</p>

    <div class="toolbar">

      <input
        id="search"
        type="search"
        placeholder="Search rows..."
        autocomplete="off"
        aria-label="Search rows"
      >

      <button id="firstPage" type="button" disabled>«</button>
      <button id="prevPage" type="button" disabled>← Previous</button>

      <span id="pageInfo" class="status"></span>

      <button id="nextPage" type="button" disabled>Next →</button>
      <button id="lastPage" type="button" disabled>»</button>

      <span id="status" class="status">
        <span id="loadingDot" class="loading-dot"></span>
        <span id="statusText">Loading data.csv…</span>
      </span>

    </div>

    <div id="output">
      <div class="message">Waiting for first rows…</div>
    </div>

  </main>

  <script>
    "use strict";


    /*
     * ============================================================
     * SETTINGS
     * ============================================================
     */

    const CSV_FILE = "data.csv";

    // Only this many rows are inserted into the HTML table.
    const PAGE_SIZE = 100;

    // Search waits this long after the user stops typing.
    const SEARCH_DELAY = 200;

    // While streaming, don't redraw faster than this.
    const RENDER_DELAY = 100;


    /*
     * ============================================================
     * ELEMENTS
     * ============================================================
     */

    const output = document.getElementById("output");

    const searchInput = document.getElementById("search");

    const statusText = document.getElementById("statusText");
    const loadingDot = document.getElementById("loadingDot");

    const pageInfo = document.getElementById("pageInfo");

    const firstPageButton = document.getElementById("firstPage");
    const prevPageButton = document.getElementById("prevPage");
    const nextPageButton = document.getElementById("nextPage");
    const lastPageButton = document.getElementById("lastPage");


    /*
     * ============================================================
     * DATA
     * ============================================================
     */

    let columns = [];

    let rows = [];
    let visibleRows = rows;

    let currentPage = 0;

    let sortColumn = null;
    let sortAscending = true;

    let loading = true;

    let bytesLoaded = 0;
    let totalBytes = 0;

    let searchTimer = null;
    let renderTimer = null;

    let viewNeedsUpdate = false;


    const collator = new Intl.Collator(undefined, {
      numeric: true,
      sensitivity: "base"
    });


    /*
     * ============================================================
     * CSV PARSER STATE
     * ============================================================
     */

    let parserField = "";
    let parserRow = [];

    let parserInQuotes = false;

    /*
     * If a network chunk happens to end exactly on a quote,
     * we need the next character before knowing whether it was:
     *
     *     ""
     *
     * or the end of a quoted field.
     */
    let parserPendingQuote = false;

    let parserPreviousCR = false;

    let headerLoaded = false;


    /*
     * ============================================================
     * BASIC HELPERS
     * ============================================================
     */

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    /*
     * Make cells containing a complete HTTP or HTTPS URL clickable.
     *
     * This DOES NOT load the URL.
     *
     * The external site is only contacted if the visitor clicks it.
     */
    function renderCell(value) {
      const text = String(value ?? "");
      const trimmed = text.trim();

      if (!trimmed) {
        return "";
      }

      if (
        trimmed.startsWith("https://") ||
        trimmed.startsWith("http://")
      ) {
        try {
          const url = new URL(trimmed);

          if (
            url.protocol === "https:" ||
            url.protocol === "http:"
          ) {
            return (
              '<a href="' +
              escapeHtml(url.href) +
              '" target="_blank" rel="noopener noreferrer">' +
              escapeHtml(trimmed) +
              "</a>"
            );
          }
        } catch {
          // Invalid URL. Fall through to normal text.
        }
      }

      return escapeHtml(text);
    }


    function formatBytes(bytes) {
      if (!Number.isFinite(bytes) || bytes <= 0) {
        return "0 B";
      }

      const units = ["B", "KB", "MB", "GB"];

      let value = bytes;
      let unit = 0;

      while (
        value >= 1024 &&
        unit < units.length - 1
      ) {
        value /= 1024;
        unit++;
      }

      return (
        value.toFixed(unit === 0 ? 0 : 1) +
        " " +
        units[unit]
      );
    }


    /*
     * ============================================================
     * STATUS
     * ============================================================
     */

    function updateStatus() {
      const rowCount = rows.length.toLocaleString();

      if (loading) {
        if (totalBytes > 0) {
          const percentage = Math.min(
            100,
            Math.round((bytesLoaded / totalBytes) * 100)
          );

          statusText.textContent =
            rowCount +
            " rows — " +
            percentage +
            "% (" +
            formatBytes(bytesLoaded) +
            " / " +
            formatBytes(totalBytes) +
            ")";
        } else {
          statusText.textContent =
            rowCount + " rows loaded…";
        }

        return;
      }

      loadingDot.style.display = "none";

      if (searchInput.value.trim()) {
        statusText.textContent =
          visibleRows.length.toLocaleString() +
          " matches from " +
          rows.length.toLocaleString() +
          " rows";
      } else {
        statusText.textContent =
          rows.length.toLocaleString() +
          " rows loaded";
      }
    }


    /*
     * ============================================================
     * PAGINATION
     * ============================================================
     */

    function getPageCount() {
      return Math.max(
        1,
        Math.ceil(
          visibleRows.length / PAGE_SIZE
        )
      );
    }


    function updatePagination() {
      const pageCount = getPageCount();

      if (currentPage >= pageCount) {
        currentPage = pageCount - 1;
      }

      if (currentPage < 0) {
        currentPage = 0;
      }

      const hasRows = visibleRows.length > 0;

      firstPageButton.disabled =
        !hasRows ||
        currentPage === 0;

      prevPageButton.disabled =
        !hasRows ||
        currentPage === 0;

      nextPageButton.disabled =
        !hasRows ||
        currentPage >= pageCount - 1;

      lastPageButton.disabled =
        !hasRows ||
        currentPage >= pageCount - 1;

      if (!hasRows) {
        pageInfo.textContent = "No rows";
        return;
      }

      pageInfo.textContent =
        "Page " +
        (currentPage + 1).toLocaleString() +
        " of " +
        pageCount.toLocaleString();
    }


    /*
     * ============================================================
     * TABLE RENDERING
     * ============================================================
     */

    function renderTable() {
      updateStatus();
      updatePagination();

      if (!columns.length) {
        return;
      }

      const start =
        currentPage * PAGE_SIZE;

      const end =
        Math.min(
          start + PAGE_SIZE,
          visibleRows.length
        );


      /*
       * Header
       */

      let headerHtml = "";

      for (let i = 0; i < columns.length; i++) {
        const column = columns[i];

        let arrow = "";

        if (column === sortColumn) {
          arrow =
            '<span class="sort-arrow">' +
            (sortAscending ? "▲" : "▼") +
            "</span>";
        }

        headerHtml +=
          '<th data-column="' +
          escapeHtml(column) +
          '">' +
          escapeHtml(column) +
          arrow +
          "</th>";
      }


      /*
       * Body
       */

      let bodyHtml = "";

      for (
        let rowIndex = start;
        rowIndex < end;
        rowIndex++
      ) {
        const row = visibleRows[rowIndex];

        bodyHtml += "<tr>";

        for (
          let columnIndex = 0;
          columnIndex < columns.length;
          columnIndex++
        ) {
          const column =
            columns[columnIndex];

          bodyHtml +=
            "<td>" +
            renderCell(row[column]) +
            "</td>";
        }

        bodyHtml += "</tr>";
      }


      if (!bodyHtml) {
        bodyHtml =
          '<tr>' +
          '<td colspan="' +
          Math.max(columns.length, 1) +
          '" style="text-align:center;padding:30px;color:#656d76">' +
          (loading ? "Loading…" : "No matching rows") +
          "</td>" +
          "</tr>";
      }


      output.innerHTML =
        '<div class="table-wrap">' +
          "<table>" +
            "<thead>" +
              "<tr>" +
                headerHtml +
              "</tr>" +
            "</thead>" +

            "<tbody>" +
              bodyHtml +
            "</tbody>" +
          "</table>" +
        "</div>";
    }


    /*
     * Don't rebuild the table after every single CSV row.
     *
     * Rows still appear progressively, but the browser only
     * redraws roughly every 100ms while the file streams.
     */
    function scheduleRender() {
      if (renderTimer !== null) {
        return;
      }

      renderTimer = setTimeout(() => {
        renderTimer = null;

        if (viewNeedsUpdate) {
          applyView(false);
          viewNeedsUpdate = false;
        } else {
          renderTable();
        }

      }, RENDER_DELAY);
    }


    /*
     * ============================================================
     * CSV ROW HANDLING
     * ============================================================
     */

    function createUniqueHeaders(values) {
      const result = [];
      const counts = new Map();

      for (let i = 0; i < values.length; i++) {
        let name = String(values[i] ?? "")
          .replace(/^\uFEFF/, "")
          .trim();

        if (!name) {
          name = "Column " + (i + 1);
        }

        const count =
          (counts.get(name) || 0) + 1;

        counts.set(name, count);

        if (count > 1) {
          result.push(
            name + " (" + count + ")"
          );
        } else {
          result.push(name);
        }
      }

      return result;
    }


    function handleCsvRow(values) {
      /*
       * Skip a totally empty CSV line.
       */
      let containsData = false;

      for (let i = 0; i < values.length; i++) {
        if (String(values[i] ?? "").trim() !== "") {
          containsData = true;
          break;
        }
      }

      if (!containsData) {
        return;
      }


      /*
       * First row = headers.
       */
      if (!headerLoaded) {
        columns =
          createUniqueHeaders(values);

        headerLoaded = true;

        renderTable();

        return;
      }


      const row = {};

      for (let i = 0; i < columns.length; i++) {
        row[columns[i]] =
          values[i] ?? "";
      }

      rows.push(row);


      /*
       * Fast path when there is no search or sorting.
       */
      if (
        !searchInput.value.trim() &&
        !sortColumn
      ) {
        visibleRows = rows;
      } else {
        /*
         * Search/sort is active, so refresh the view
         * on the next throttled render.
         */
        viewNeedsUpdate = true;
      }

      scheduleRender();
    }


    /*
     * ============================================================
     * STREAMING CSV PARSER
     * ============================================================
     *
     * Supports:
     *
     *   normal CSV
     *   quoted fields
     *   commas inside quotes
     *   "" escaped quotes
     *   multiline quoted values
     *   CRLF
     *   LF
     *
     * The parser state survives across network chunks.
     * ============================================================
     */

    function emitField() {
      parserRow.push(parserField);
      parserField = "";
    }


    function emitRow() {
      emitField();

      handleCsvRow(parserRow);

      parserRow = [];
      parserField = "";
    }


    function processCsvChunk(text) {
      for (
        let i = 0;
        i < text.length;
        i++
      ) {
        let char = text[i];


        /*
         * Previous network chunk ended directly
         * after a quote inside a quoted field.
         */
        if (parserPendingQuote) {
          parserPendingQuote = false;

          if (char === '"') {
            /*
             * Previous quote + this quote = escaped ".
             */
            parserField += '"';
            continue;
          }

          /*
           * Previous quote was the closing quote.
           */
          parserInQuotes = false;

          /*
           * Do NOT continue.
           *
           * Current character still needs normal
           * processing, e.g. comma or newline.
           */
        }


        /*
         * Inside quoted field.
         */
        if (parserInQuotes) {
          if (char === '"') {

            /*
             * Is there another character available
             * in this network chunk?
             */
            if (i + 1 < text.length) {

              if (text[i + 1] === '"') {
                /*
                 * ""
                 */
                parserField += '"';
                i++;
              } else {
                /*
                 * Closing quote.
                 */
                parserInQuotes = false;
              }

            } else {
              /*
               * Quote is the final character in this
               * network chunk. Decide when next chunk
               * arrives.
               */
              parserPendingQuote = true;
            }

          } else {
            /*
             * Commas/newlines inside quotes are text.
             */
            parserField += char;
          }

          continue;
        }


        /*
         * Handle CRLF correctly outside quoted fields.
         */
        if (parserPreviousCR) {
          parserPreviousCR = false;

          if (char === "\n") {
            /*
             * CR already emitted the row.
             * Ignore the LF half of CRLF.
             */
            continue;
          }
        }


        /*
         * Start quoted value.
         */
        if (
          char === '"' &&
          parserField.length === 0
        ) {
          parserInQuotes = true;
          continue;
        }


        /*
         * Next column.
         */
        if (char === ",") {
          emitField();
          continue;
        }


        /*
         * Windows/Mac newline.
         */
        if (char === "\r") {
          emitRow();
          parserPreviousCR = true;
          continue;
        }


        /*
         * Unix newline.
         */
        if (char === "\n") {
          emitRow();
          continue;
        }


        /*
         * Normal character.
         */
        parserField += char;
      }
    }


    function finishCsvParser() {
      /*
       * A pending quote at EOF is a closing quote.
       */
      if (parserPendingQuote) {
        parserPendingQuote = false;
        parserInQuotes = false;
      }


      /*
       * Emit final row if file doesn't end in newline.
       */
      if (
        parserField.length > 0 ||
        parserRow.length > 0
      ) {
        emitRow();
      }
    }


    /*
     * ============================================================
     * SEARCH
     * ============================================================
     */

    function rowMatchesQuery(row, query) {
      for (
        let i = 0;
        i < columns.length;
        i++
      ) {
        const value =
          row[columns[i]];

        if (
          value !== null &&
          value !== undefined &&
          String(value)
            .toLowerCase()
            .includes(query)
        ) {
          return true;
        }
      }

      return false;
    }


    function applyView(resetPage = true) {
      const query =
        searchInput.value
          .trim()
          .toLowerCase();


      /*
       * Filter.
       */
      if (!query) {
        visibleRows = rows;
      } else {
        const matches = [];

        for (
          let i = 0;
          i < rows.length;
          i++
        ) {
          if (
            rowMatchesQuery(
              rows[i],
              query
            )
          ) {
            matches.push(rows[i]);
          }
        }

        visibleRows = matches;
      }


      /*
       * Sort.
       */
      if (sortColumn) {
        const column =
          sortColumn;

        const direction =
          sortAscending ? 1 : -1;

        visibleRows =
          visibleRows.slice();

        visibleRows.sort((a, b) => {
          const aText =
            String(a[column] ?? "");

          const bText =
            String(b[column] ?? "");

          const aNumber =
            Number(aText);

          const bNumber =
            Number(bText);

          const bothNumeric =
            aText.trim() !== "" &&
            bText.trim() !== "" &&
            Number.isFinite(aNumber) &&
            Number.isFinite(bNumber);

          let result;

          if (bothNumeric) {
            result =
              aNumber - bNumber;
          } else {
            result =
              collator.compare(
                aText,
                bText
              );
          }

          return result * direction;
        });
      }


      if (resetPage) {
        currentPage = 0;
      }

      renderTable();
    }


    searchInput.addEventListener(
      "input",
      () => {
        clearTimeout(searchTimer);

        searchTimer = setTimeout(() => {
          applyView(true);
        }, SEARCH_DELAY);
      }
    );


    /*
     * ============================================================
     * SORTING
     * ============================================================
     */

    output.addEventListener(
      "click",
      event => {
        const header =
          event.target.closest(
            "th[data-column]"
          );

        if (!header) {
          return;
        }

        const column =
          header.dataset.column;

        if (sortColumn === column) {
          sortAscending =
            !sortAscending;
        } else {
          sortColumn = column;
          sortAscending = true;
        }

        applyView(true);
      }
    );


    /*
     * ============================================================
     * PAGINATION
     * ============================================================
     */

    firstPageButton.addEventListener(
      "click",
      () => {
        currentPage = 0;
        renderTable();
      }
    );


    prevPageButton.addEventListener(
      "click",
      () => {
        if (currentPage > 0) {
          currentPage--;
          renderTable();
        }
      }
    );


    nextPageButton.addEventListener(
      "click",
      () => {
        if (
          currentPage <
          getPageCount() - 1
        ) {
          currentPage++;
          renderTable();
        }
      }
    );


    lastPageButton.addEventListener(
      "click",
      () => {
        currentPage =
          getPageCount() - 1;

        renderTable();
      }
    );


    /*
     * ============================================================
     * LOAD data.csv
     * ============================================================
     *
     * This page automatically loads ONLY:
     *
     *     ./data.csv
     *
     * There are:
     *
     *     NO CDN requests
     *     NO external JavaScript
     *     NO external CSS
     *     NO external fonts
     *     NO APIs
     *     NO analytics
     *     NO trackers
     *
     * URLs from data.csv are only contacted when
     * somebody actually clicks them.
     * ============================================================
     */

    async function loadCsv() {
      try {
        const response =
          await fetch("./" + CSV_FILE, {
            cache: "no-store"
          });


        if (!response.ok) {
          throw new Error(
            "HTTP " +
            response.status +
            " " +
            response.statusText
          );
        }


        /*
         * Content-Length may or may not be supplied
         * depending on static host configuration.
         */
        const lengthHeader =
          response.headers.get(
            "Content-Length"
          );

        if (lengthHeader) {
          const value =
            Number(lengthHeader);

          if (
            Number.isFinite(value) &&
            value > 0
          ) {
            totalBytes = value;
          }
        }


        /*
         * Preferred path: stream the response.
         */
        if (
          response.body &&
          typeof response.body.getReader === "function"
        ) {
          const reader =
            response.body.getReader();

          const decoder =
            new TextDecoder("utf-8");


          while (true) {
            const result =
              await reader.read();

            if (result.done) {
              break;
            }

            bytesLoaded +=
              result.value.byteLength;

            const text =
              decoder.decode(
                result.value,
                {
                  stream: true
                }
              );

            processCsvChunk(text);

            updateStatus();
          }


          /*
           * Flush any remaining UTF-8 decoder bytes.
           */
          const finalText =
            decoder.decode();

          if (finalText) {
            processCsvChunk(finalText);
          }

        } else {

          /*
           * Older-browser fallback.
           *
           * Still works, just won't progressively
           * render during network download.
           */
          const text =
            await response.text();

          bytesLoaded =
            totalBytes ||
            text.length;

          processCsvChunk(text);
        }


        finishCsvParser();

        loading = false;

        applyView(false);

      } catch (error) {
        loading = false;

        loadingDot.style.display =
          "none";

        statusText.textContent =
          "Could not load data.csv";

        output.innerHTML =
          '<div class="error">' +
            "<strong>Could not load data.csv.</strong>" +
            "<br><br>" +
            escapeHtml(
              error.message || error
            ) +
            "<br><br>" +
            "Make sure <strong>index.html</strong> and " +
            "<strong>data.csv</strong> are in the same directory." +
          "</div>";

        console.error(error);
      }
    }


    /*
     * Start immediately.
     */
    loadCsv();
  </script>

</body>
</html>
