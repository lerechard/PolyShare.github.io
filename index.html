<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cal Poly PDF Share 2</title>
 

  <!-- Papa Parse: CSV parser -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    :root {
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1f2328;
      background: #f6f8fa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 32px 16px;
    }

    .container {
      width: min(1200px, 100%);
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
    }

    .subtitle {
      margin: 0 0 20px;
      color: #656d76;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    input[type="search"] {
      width: min(420px, 100%);
      padding: 10px 12px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      background: white;
      font: inherit;
    }

    .status {
      color: #656d76;
      font-size: 0.9rem;
    }

    .table-wrap {
      overflow: auto;
      background: white;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      box-shadow: 0 1px 2px rgba(31, 35, 40, 0.04);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 600px;
    }

    th,
    td {
      padding: 10px 12px;
      border-bottom: 1px solid #d8dee4;
      border-right: 1px solid #d8dee4;
      text-align: left;
      vertical-align: top;
      white-space: nowrap;
    }

    th:last-child,
    td:last-child {
      border-right: 0;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    th {
      position: sticky;
      top: 0;
      background: #f6f8fa;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      z-index: 1;
    }

    tbody tr:nth-child(even) {
      background: #fbfcfd;
    }

    tbody tr:hover {
      background: #eef6ff;
    }

    .error {
      padding: 16px;
      color: #cf222e;
      background: #ffebe9;
      border: 1px solid #ff8182;
      border-radius: 6px;
    }

    .sort-indicator {
      margin-left: 4px;
      color: #656d76;
      font-size: 0.8em;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Cal Poly PDF Share 2</h1>
    <p class="subtitle">It's the remix</p>

    <div class="toolbar">
      <input id="search" type="search" placeholder="Search rows..." aria-label="Search rows" />
      <span id="status" class="status">Loading…</span>
    </div>

    <div id="output"></div>
  </main>

  <script>
    const CSV_FILE = "data.csv";

    const output = document.getElementById("output");
    const searchInput = document.getElementById("search");
    const status = document.getElementById("status");
    document.getElementById("csv-name").textContent = CSV_FILE;

    let rows = [];
    let columns = [];
    let sortColumn = null;
    let sortAscending = true;

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function getFilteredRows() {
      const query = searchInput.value.trim().toLowerCase();

      let filtered = !query
        ? [...rows]
        : rows.filter(row =>
            columns.some(column =>
              String(row[column] ?? "").toLowerCase().includes(query)
            )
          );

      if (sortColumn) {
        filtered.sort((a, b) => {
          const aValue = String(a[sortColumn] ?? "");
          const bValue = String(b[sortColumn] ?? "");

          const aNumber = Number(aValue);
          const bNumber = Number(bValue);
          const bothNumbers =
            aValue.trim() !== "" &&
            bValue.trim() !== "" &&
            Number.isFinite(aNumber) &&
            Number.isFinite(bNumber);

          const comparison = bothNumbers
            ? aNumber - bNumber
            : aValue.localeCompare(bValue, undefined, {
                numeric: true,
                sensitivity: "base"
              });

          return sortAscending ? comparison : -comparison;
        });
      }

      return filtered;
    }

    function renderTable() {
      const filteredRows = getFilteredRows();

      status.textContent =
        `${filteredRows.length.toLocaleString()} of ${rows.length.toLocaleString()} rows`;

      if (!columns.length) {
        output.innerHTML = '<div class="error">The CSV does not contain any columns.</div>';
        return;
      }

      const header = columns.map(column => {
        let indicator = "";
        if (sortColumn === column) {
          indicator = `<span class="sort-indicator">${sortAscending ? "▲" : "▼"}</span>`;
        }

        return `<th data-column="${escapeHtml(column)}">${escapeHtml(column)}${indicator}</th>`;
      }).join("");

      const body = filteredRows.map(row => {
        const cells = columns
          .map(column => `<td>${escapeHtml(row[column])}</td>`)
          .join("");
        return `<tr>${cells}</tr>`;
      }).join("");

      output.innerHTML = `
        <div class="table-wrap">
          <table>
            <thead><tr>${header}</tr></thead>
            <tbody>${body}</tbody>
          </table>
        </div>
      `;

      output.querySelectorAll("th").forEach(th => {
        th.addEventListener("click", () => {
          const column = th.dataset.column;

          if (sortColumn === column) {
            sortAscending = !sortAscending;
          } else {
            sortColumn = column;
            sortAscending = true;
          }

          renderTable();
        });
      });
    }

    Papa.parse(CSV_FILE, {
      download: true,
      header: true,
      skipEmptyLines: true,
      transformHeader: header => header.trim(),

      complete: results => {
        if (results.errors.length) {
          console.warn("CSV parsing warnings:", results.errors);
        }

        columns = results.meta.fields || [];
        rows = results.data || [];
        renderTable();
      },

      error: error => {
        status.textContent = "Unable to load CSV";
        output.innerHTML = `
          <div class="error">
            <strong>Could not load ${escapeHtml(CSV_FILE)}.</strong>
            ${escapeHtml(error.message || error)}
          </div>
        `;
      }
    });

    searchInput.addEventListener("input", renderTable);
  </script>
</body>
</html>
