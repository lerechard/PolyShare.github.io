<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Cal Poly PDF Share 2</title>

  <style>
    :root {
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: #1f2328;
      background: #f6f8fa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 32px 16px;
    }

    .container {
      width: min(1200px, 100%);
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
    }

    .subtitle {
      margin: 0 0 20px;
      color: #656d76;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    input[type="search"] {
      width: min(420px, 100%);
      padding: 10px 12px;

      border: 1px solid #d0d7de;
      border-radius: 6px;

      background: white;
      color: inherit;

      font: inherit;
    }

    input[type="search"]:focus {
      outline: 2px solid #0969da;
      outline-offset: -1px;
    }

    button {
      padding: 9px 12px;

      border: 1px solid #d0d7de;
      border-radius: 6px;

      background: white;
      color: inherit;

      font: inherit;
      cursor: pointer;
    }

    button:hover:not(:disabled) {
      background: #f3f4f6;
    }

    button:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .status {
      color: #656d76;
      font-size: 0.9rem;
    }

    .loading-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .loading-dot {
      width: 8px;
      height: 8px;

      border-radius: 50%;
      background: #1f883d;

      animation: pulse 0.8s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      from {
        opacity: 0.25;
      }

      to {
        opacity: 1;
      }
    }

    .table-wrap {
      overflow: auto;
      max-height: 75vh;

      background: white;

      border: 1px solid #d0d7de;
      border-radius: 8px;

      box-shadow: 0 1px 2px rgba(31, 35, 40, 0.04);
    }

    table {
      width: 100%;
      min-width: 600px;

      border-collapse: collapse;
    }

    th,
    td {
      padding: 9px 12px;

      border-bottom: 1px solid #d8dee4;
      border-right: 1px solid #d8dee4;

      text-align: left;
      vertical-align: top;

      white-space: nowrap;
    }

    th:last-child,
    td:last-child {
      border-right: 0;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 2;

      background: #f6f8fa;

      font-weight: 600;
      cursor: pointer;
      user-select: none;
    }

    th:hover {
      background: #eaeef2;
    }

    tbody tr:nth-child(even) {
      background: #fbfcfd;
    }

    tbody tr:hover {
      background: #eef6ff;
    }

    .sort-indicator {
      margin-left: 4px;
      color: #656d76;
      font-size: 0.8em;
    }

    .error {
      padding: 16px;

      color: #cf222e;
      background: #ffebe9;

      border: 1px solid #ff8182;
      border-radius: 6px;
    }

    .empty {
      padding: 32px;
      text-align: center;
      color: #656d76;
    }

    @media (max-width: 700px) {
      body {
        padding: 20px 10px;
      }

      h1 {
        font-size: 1.6rem;
      }

      input[type="search"] {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Cal Poly PDF Share 2</h1>
    <p class="subtitle">It's the remix</p>

    <div class="toolbar">
      <input
        id="search"
        type="search"
        placeholder="Search loaded rows..."
        aria-label="Search rows"
        autocomplete="off"
      />

      <button id="firstPage" type="button" disabled>
        «
      </button>

      <button id="prevPage" type="button" disabled>
        ← Previous
      </button>

      <span id="pageInfo" class="status"></span>

      <button id="nextPage" type="button" disabled>
        Next →
      </button>

      <button id="lastPage" type="button" disabled>
        »
      </button>

      <span class="status loading-status">
        <span id="loadingDot" class="loading-dot"></span>
        <span id="statusText">Opening data.csv…</span>
      </span>
    </div>

    <div id="output">
      <div class="empty">
        Loading first rows…
      </div>
    </div>
  </main>

  <script>
    "use strict";

    /*
     * ==========================================================
     * CONFIG
     * ==========================================================
     */

    const CSV_FILE = "data.csv";

    // Only this many rows exist in the HTML table at once.
    const PAGE_SIZE = 100;

    // Wait briefly after typing before searching.
    const SEARCH_DELAY = 200;


    /*
     * ==========================================================
     * ELEMENTS
     * ==========================================================
     */

    const output =
      document.getElementById("output");

    const searchInput =
      document.getElementById("search");

    const statusText =
      document.getElementById("statusText");

    const loadingDot =
      document.getElementById("loadingDot");

    const pageInfo =
      document.getElementById("pageInfo");

    const firstPageButton =
      document.getElementById("firstPage");

    const prevPageButton =
      document.getElementById("prevPage");

    const nextPageButton =
      document.getElementById("nextPage");

    const lastPageButton =
      document.getElementById("lastPage");


    /*
     * ==========================================================
     * TABLE STATE
     * ==========================================================
     */

    let rows = [];
    let visibleRows = rows;
    let columns = [];

    let currentPage = 0;

    let sortColumn = null;
    let sortAscending = true;

    let loading = true;
    let searchTimer = null;

    let renderQueued = false;

    let bytesLoaded = 0;
    let totalBytes = 0;


    const collator = new Intl.Collator(
      undefined,
      {
        numeric: true,
        sensitivity: "base"
      }
    );


    /*
     * ==========================================================
     * CSV STREAMING PARSER STATE
     * ==========================================================
     *
     * This parser supports:
     *
     * - commas inside quoted fields
     * - escaped quotes ("")
     * - newlines inside quoted fields
     * - Windows CRLF
     * - Unix LF
     * - streaming chunks
     *
     * No external library is required.
     */

    let csvField = "";
    let csvRow = [];

    let csvInsideQuotes = false;
    let csvQuotePending = false;

    let headerRead = false;


    /*
     * ==========================================================
     * HELPERS
     * ==========================================================
     */

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    function formatBytes(bytes) {
      if (!Number.isFinite(bytes) || bytes <= 0) {
        return "0 KB";
      }

      const units = [
        "B",
        "KB",
        "MB",
        "GB"
      ];

      let value = bytes;
      let index = 0;

      while (
        value >= 1024 &&
        index < units.length - 1
      ) {
        value /= 1024;
        index++;
      }

      return (
        value.toFixed(
          index === 0 ? 0 : 1
        ) +
        " " +
        units[index]
      );
    }


    function getPageCount() {
      return Math.max(
        1,
        Math.ceil(
          visibleRows.length /
          PAGE_SIZE
        )
      );
    }


    function updatePagination() {
      const pageCount =
        getPageCount();

      if (
        currentPage >=
        pageCount
      ) {
        currentPage =
          pageCount - 1;
      }

      if (currentPage < 0) {
        currentPage = 0;
      }

      const hasRows =
        visibleRows.length > 0;

      firstPageButton.disabled =
        !hasRows ||
        currentPage === 0;

      prevPageButton.disabled =
        !hasRows ||
        currentPage === 0;

      nextPageButton.disabled =
        !hasRows ||
        currentPage >=
          pageCount - 1;

      lastPageButton.disabled =
        !hasRows ||
        currentPage >=
          pageCount - 1;

      if (!hasRows) {
        pageInfo.textContent =
          "No rows";
      } else {
        pageInfo.textContent =
          `Page ${
            (currentPage + 1)
              .toLocaleString()
          } of ${
            pageCount
              .toLocaleString()
          }`;
      }
    }


    function updateStatus() {
      const count =
        rows.length.toLocaleString();

      if (loading) {
        if (totalBytes > 0) {
          const percent =
            Math.min(
              100,
              Math.round(
                (
                  bytesLoaded /
                  totalBytes
                ) * 100
              )
            );

          statusText.textContent =
            `${count} rows loaded — ` +
            `${percent}% ` +
            `(${formatBytes(bytesLoaded)} / ` +
            `${formatBytes(totalBytes)})`;
        } else {
          statusText.textContent =
            `${count} rows loaded…`;
        }

        return;
      }

      loadingDot.style.display =
        "none";

      const query =
        searchInput.value.trim();

      if (query) {
        statusText.textContent =
          `${visibleRows.length.toLocaleString()} matches ` +
          `from ${count} rows`;
      } else {
        statusText.textContent =
          `${count} rows loaded`;
      }
    }


    /*
     * ==========================================================
     * DOM RENDERING
     * ==========================================================
     */

    function queueRender() {
      if (renderQueued) {
        return;
      }

      renderQueued = true;

      requestAnimationFrame(() => {
        renderQueued = false;
        renderPage();
      });
    }


    function renderPage() {
      updateStatus();
      updatePagination();

      if (!columns.length) {
        return;
      }

      const start =
        currentPage * PAGE_SIZE;

      const end =
        Math.min(
          start + PAGE_SIZE,
          visibleRows.length
        );


      /*
       * Header
       */

      let headerHtml = "";

      for (
        let i = 0;
        i < columns.length;
        i++
      ) {
        const column =
          columns[i];

        let indicator = "";

        if (
          sortColumn === column
        ) {
          indicator = `
            <span class="sort-indicator">
              ${sortAscending ? "▲" : "▼"}
            </span>
          `;
        }

        headerHtml += `
          <th data-column="${escapeHtml(column)}">
            ${escapeHtml(column)}
            ${indicator}
          </th>
        `;
      }


      /*
       * Rows
       */

      let bodyHtml = "";

      for (
        let rowIndex = start;
        rowIndex < end;
        rowIndex++
      ) {
        const row =
          visibleRows[rowIndex];

        bodyHtml += "<tr>";

        for (
          let columnIndex = 0;
          columnIndex < columns.length;
          columnIndex++
        ) {
          const column =
            columns[columnIndex];

          bodyHtml +=
            `<td>${escapeHtml(row[column])}</td>`;
        }

        bodyHtml += "</tr>";
      }


      if (!bodyHtml) {
        bodyHtml = `
          <tr>
            <td
              colspan="${Math.max(columns.length, 1)}"
              class="empty"
            >
              ${
                loading
                  ? "Loading rows…"
                  : "No matching rows"
              }
            </td>
          </tr>
        `;
      }


      output.innerHTML = `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                ${headerHtml}
              </tr>
            </thead>

            <tbody>
              ${bodyHtml}
            </tbody>
          </table>
        </div>
      `;
    }


    /*
     * ==========================================================
     * CSV ROW HANDLING
     * ==========================================================
     */

    function processCompletedCsvRow(values) {
      /*
       * Skip completely blank lines.
       */
      const allBlank =
        values.every(
          value =>
            String(value)
              .trim() === ""
        );

      if (allBlank) {
        return;
      }


      /*
       * First row = column headers.
       */
      if (!headerRead) {
        columns =
          values.map((value, index) => {
            let name =
              String(value)
                .replace(/^\uFEFF/, "")
                .trim();

            /*
             * Prevent empty header names.
             */
            if (!name) {
              name =
                `Column ${index + 1}`;
            }

            return name;
          });

        headerRead = true;

        queueRender();

        return;
      }


      /*
       * Convert CSV array into an object.
       */
      const row = {};

      for (
        let i = 0;
        i < columns.length;
        i++
      ) {
        row[columns[i]] =
          values[i] ?? "";
      }

      rows.push(row);


      /*
       * If there is no filter/sort active,
       * visibleRows references the master array
       * directly.
       */
      if (
        !searchInput.value.trim() &&
        !sortColumn
      ) {
        visibleRows = rows;
      }


      /*
       * Immediately request a visible update.
       * requestAnimationFrame prevents hundreds
       * of DOM rebuilds in one frame.
       */
      queueRender();
    }


    /*
     * ==========================================================
     * STREAMING CSV PARSER
     * ==========================================================
     */

    function processCsvText(text) {
      for (
        let i = 0;
        i < text.length;
        i++
      ) {
        const char =
          text[i];


        /*
         * We encountered a quote at the end of
         * the previous text chunk and didn't yet
         * know whether it was an escaped quote.
         */
        if (csvQuotePending) {
          csvQuotePending = false;

          if (char === '"') {
            /*
             * ""
             *
             * Escaped quote inside quoted field.
             */
            csvField += '"';

            continue;
          }

          /*
           * Previous quote closed the field.
           */
          csvInsideQuotes = false;

          /*
           * Continue handling the current
           * character normally below.
           */
        }


        /*
         * Inside a quoted value.
         */
        if (csvInsideQuotes) {
          if (char === '"') {
            /*
             * If another character exists in this
             * chunk we can immediately determine
             * whether this is "" or a closing ".
             */
            if (
              i + 1 <
              text.length
            ) {
              if (
                text[i + 1] === '"'
              ) {
                csvField += '"';
                i++;
              } else {
                csvInsideQuotes = false;
              }
            } else {
              /*
               * Quote is the final character in
               * this network chunk.
               */
              csvQuotePending = true;
            }
          } else {
            /*
             * Includes commas and newlines inside
             * quoted values.
             */
            csvField += char;
          }

          continue;
        }


        /*
         * Start quoted field.
         */
        if (
          char === '"' &&
          csvField.length === 0
        ) {
          csvInsideQuotes = true;
          continue;
        }


        /*
         * New column.
         */
        if (char === ",") {
          csvRow.push(csvField);
          csvField = "";

          continue;
        }


        /*
         * New row.
         */
        if (char === "\n") {
          csvRow.push(csvField);

          /*
           * Strip trailing CR for CRLF files.
           */
          const lastIndex =
            csvRow.length - 1;

          if (
            csvRow[lastIndex]
              .endsWith("\r")
          ) {
            csvRow[lastIndex] =
              csvRow[lastIndex]
                .slice(0, -1);
          }

          processCompletedCsvRow(
            csvRow
          );

          csvRow = [];
          csvField = "";

          continue;
        }


        /*
         * Ordinary character.
         */
        csvField += char;
      }
    }


    function finishCsvParser() {
      /*
       * A quote at EOF closes the quoted field.
       */
      if (csvQuotePending) {
        csvQuotePending = false;
        csvInsideQuotes = false;
      }


      /*
       * Process final row if the CSV doesn't
       * end with a newline.
       */
      if (
        csvField.length > 0 ||
        csvRow.length > 0
      ) {
        csvRow.push(csvField);

        const lastIndex =
          csvRow.length - 1;

        if (
          csvRow[lastIndex]
            .endsWith("\r")
        ) {
          csvRow[lastIndex] =
            csvRow[lastIndex]
              .slice(0, -1);
        }

        processCompletedCsvRow(
          csvRow
        );
      }

      csvField = "";
      csvRow = [];
    }


    /*
     * ==========================================================
     * SEARCH
     * ==========================================================
     */

    function rowMatchesQuery(
      row,
      query
    ) {
      for (
        let i = 0;
        i < columns.length;
        i++
      ) {
        const value =
          row[columns[i]];

        if (
          value != null &&
          String(value)
            .toLowerCase()
            .includes(query)
        ) {
          return true;
        }
      }

      return false;
    }


    function applyFilterAndSort(
      resetPage = true
    ) {
      const query =
        searchInput.value
          .trim()
          .toLowerCase();


      /*
       * Filter
       */
      if (!query) {
        visibleRows = rows;
      } else {
        const matches = [];

        for (
          let i = 0;
          i < rows.length;
          i++
        ) {
          if (
            rowMatchesQuery(
              rows[i],
              query
            )
          ) {
            matches.push(
              rows[i]
            );
          }
        }

        visibleRows =
          matches;
      }


      /*
       * Sort
       */
      if (sortColumn) {
        const column =
          sortColumn;

        const direction =
          sortAscending
            ? 1
            : -1;

        /*
         * Don't modify master rows.
         */
        visibleRows =
          visibleRows.slice();

        visibleRows.sort(
          (a, b) => {
            const aValue =
              String(
                a[column] ?? ""
              );

            const bValue =
              String(
                b[column] ?? ""
              );

            const aNumber =
              Number(aValue);

            const bNumber =
              Number(bValue);

            const bothNumbers =
              aValue.trim() !== "" &&
              bValue.trim() !== "" &&
              Number.isFinite(aNumber) &&
              Number.isFinite(bNumber);

            let comparison;

            if (bothNumbers) {
              comparison =
                aNumber -
                bNumber;
            } else {
              comparison =
                collator.compare(
                  aValue,
                  bValue
                );
            }

            return (
              comparison *
              direction
            );
          }
        );
      }


      if (resetPage) {
        currentPage = 0;
      }

      renderPage();
    }


    /*
     * ==========================================================
     * SEARCH EVENT
     * ==========================================================
     */

    searchInput.addEventListener(
      "input",
      () => {
        clearTimeout(
          searchTimer
        );

        searchTimer =
          setTimeout(
            () => {
              applyFilterAndSort();
            },
            SEARCH_DELAY
          );
      }
    );


    /*
     * ==========================================================
     * SORT EVENT
     * ==========================================================
     */

    output.addEventListener(
      "click",
      event => {
        const header =
          event.target.closest(
            "th[data-column]"
          );

        if (!header) {
          return;
        }

        const column =
          header.dataset.column;

        if (
          sortColumn === column
        ) {
          sortAscending =
            !sortAscending;
        } else {
          sortColumn =
            column;

          sortAscending =
            true;
        }

        applyFilterAndSort();
      }
    );


    /*
     * ==========================================================
     * PAGINATION
     * ==========================================================
     */

    firstPageButton.addEventListener(
      "click",
      () => {
        currentPage = 0;
        renderPage();
      }
    );


    prevPageButton.addEventListener(
      "click",
      () => {
        if (currentPage > 0) {
          currentPage--;
          renderPage();
        }
      }
    );


    nextPageButton.addEventListener(
      "click",
      () => {
        if (
          currentPage <
          getPageCount() - 1
        ) {
          currentPage++;
          renderPage();
        }
      }
    );


    lastPageButton.addEventListener(
      "click",
      () => {
        currentPage =
          getPageCount() - 1;

        renderPage();
      }
    );


    /*
     * ==========================================================
     * LOAD + STREAM data.csv
     * ==========================================================
     */

    async function loadCsv() {
      try {
        statusText.textContent =
          "Opening data.csv…";


        /*
         * This is the ONLY resource requested
         * by this page.
         *
         * It is local:
         *
         *   ./data.csv
         *
         * There are no external websites,
         * scripts, APIs, fonts, libraries,
         * tracking calls or CDNs.
         */
        const response =
          await fetch(
            CSV_FILE,
            {
              cache: "no-store"
            }
          );


        if (!response.ok) {
          throw new Error(
            `HTTP ${response.status} ${response.statusText}`
          );
        }


        /*
         * Read file size when server provides it.
         */
        const contentLength =
          Number(
            response.headers.get(
              "Content-Length"
            )
          );

        if (
          Number.isFinite(
            contentLength
          ) &&
          contentLength > 0
        ) {
          totalBytes =
            contentLength;
        }


        /*
         * Modern browsers expose the response
         * body as a stream.
         */
        if (
          response.body &&
          response.body.getReader
        ) {
          const reader =
            response.body.getReader();

          const decoder =
            new TextDecoder(
              "utf-8"
            );


          while (true) {
            const result =
              await reader.read();

            if (result.done) {
              break;
            }

            bytesLoaded +=
              result.value.byteLength;

            /*
             * Decode ONLY this network chunk.
             */
            const text =
              decoder.decode(
                result.value,
                {
                  stream: true
                }
              );


            /*
             * Immediately parse rows from it.
             */
            processCsvText(
              text
            );


            /*
             * Update loading status.
             */
            updateStatus();
          }


          /*
           * Flush decoder's remaining bytes.
           */
          const remainingText =
            decoder.decode();

          if (remainingText) {
            processCsvText(
              remainingText
            );
          }


        } else {
          /*
           * Fallback for older browsers.
           *
           * It still works, but won't visually
           * stream while downloading.
           */
          const text =
            await response.text();

          bytesLoaded =
            new TextEncoder()
              .encode(text)
              .byteLength;

          processCsvText(
            text
          );
        }


        /*
         * Handle CSV's final row.
         */
        finishCsvParser();


        loading = false;

        /*
         * Reapply any active search/sort against
         * the now-complete data.
         */
        applyFilterAndSort(
          false
        );

      } catch (error) {
        loading = false;

        loadingDot.style.display =
          "none";

        statusText.textContent =
          "Unable to load data.csv";

        output.innerHTML = `
          <div class="error">
            <strong>
              Could not load data.csv.
            </strong>

            <br><br>

            ${escapeHtml(
              error.message || error
            )}

            <br><br>

            Make sure
            <strong>index.html</strong>
            and
            <strong>data.csv</strong>
            are in the same folder.
          </div>
        `;

        console.error(error);
      }
    }


    /*
     * Start immediately.
     */
    loadCsv();
  </script>
</body>
</html>
